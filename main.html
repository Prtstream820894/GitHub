<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRT STREAM Playlist</title>
</head>
<body>
<p id="status">Playlist taiyar ho rahi hai...</p>

<script>
(async function () {
  const urls = [
    "https://royal-bird-6a0a.poonamchouhan076.workers.dev/",
    "https://tight-firefly-ecdd.poonamchouhan076.workers.dev/"
  ];

  const status = document.getElementById("status");

  try {
    const results = await Promise.all(
      urls.map(async url => {
        try {
          const freshUrl = url + (url.includes("?") ? "&" : "?")
            + "_t=" + Date.now();

          const response = await fetch(freshUrl, {
            cache: "no-store"
          });

          if (!response.ok) return "";

          return (await response.text())
            .replace(/^\uFEFF/, "")
            .replace(/^#EXTM3U[^\r\n]*(?:\r?\n)?/gm, "")
            .trim();
        } catch (e) {
          return "";
        }
      })
    );

    const playlists = results.filter(Boolean);

    if (!playlists.length) {
      throw new Error("Playlist fetch nahi hui. Worker CORS check karo.");
    }

    const playlist = "#EXTM3U\n" + playlists.join("\n") + "\n";
    const blob = new Blob([playlist], {
      type: "audio/x-mpegurl"
    });

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "PRT_STREAM.m3u";
    document.body.appendChild(link);
    link.click();
    link.remove();

    status.textContent = "Playlist download start ho gayi.";

    setTimeout(() => URL.revokeObjectURL(link.href), 60000);
  } catch (error) {
    status.textContent = error.message;
  }
})();
</script>
</body>
</html>
